# NOTE: In production, use AWS Secrets Manager with the External Secrets
# Operator to sync secrets into Kubernetes instead of storing them directly
# in manifests. This placeholder is provided for local/dev reference only.
#
# Example External Secrets Operator setup:
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata:
#     name: quickapp-db-secret
#     namespace: quickapp
#   spec:
#     refreshInterval: 1h
#     secretStoreRef:
#       name: aws-secrets-manager
#       kind: ClusterSecretStore
#     target:
#       name: quickapp-secret
#     data:
#       - secretKey: ConnectionStrings__DefaultConnection
#         remoteRef:
#           key: quickapp/db-connection-string
apiVersion: v1
kind: Secret
metadata:
  name: quickapp-secret
  namespace: quickapp
  labels:
    app.kubernetes.io/name: quickapp
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Server=<RDS_ENDPOINT>;Database=QuickApp;User Id=<DB_USER>;Password=<DB_PASSWORD>;TrustServerCertificate=true;MultipleActiveResultSets=true"
  # OIDC signing/encryption certificate configuration.
  # Required for multi-replica deployments — without a shared certificate,
  # each pod generates ephemeral keys and tokens issued by one pod cannot
  # be validated by another.
  OIDC__Certificates__Path: "/app/certs/oidc.pfx"
  OIDC__Certificates__Password: "<CERTIFICATE_PASSWORD>"
